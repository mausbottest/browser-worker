name: hoody-watch

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: hoody-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4

      - name: Check Hoody free tier
        env:
          HOODY_EMAIL: ${{ secrets.HOODY_EMAIL }}
          HOODY_PASSWORD: ${{ secrets.HOODY_PASSWORD }}
        run: python3 scripts/hoody_watch.py

      - name: Commit status
        run: |
          git config user.name "hoody-watch"
          git config user.email "hoody-watch@users.noreply.github.com"
          git add status/
          if ! git diff --cached --quiet; then
            git commit -m "status: $(date -u +%FT%TZ)"
            git push
          fi

      - name: Open an issue once a server is claimed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if grep -q '"claimed": true' status/hoody.json; then
            if ! gh issue list --state all --search 'Hoody free server claimed in:title' \
                 --json number -q 'length > 0' | grep -q true; then
              gh issue create --title "Hoody free server claimed" --body "$(cat status/hoody.json)"
            fi
          fi
